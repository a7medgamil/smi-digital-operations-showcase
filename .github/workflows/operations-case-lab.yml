name: Independent operations case lab
on:
  push:
    paths: ['demo/operations-case-lab/**', '.github/workflows/operations-case-lab.yml']
  pull_request:
    paths: ['demo/operations-case-lab/**', '.github/workflows/operations-case-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: demo/operations-case-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
